name: Update Contribution Leaderboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 02:00 UTC
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for accurate stats

      - name: Update leaderboard
        run: python3 scripts/update_leaderboard.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "No changes." || \
            git commit -m "chore: update contribution leaderboard [skip ci]" && git push

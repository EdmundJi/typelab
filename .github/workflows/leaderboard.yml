name: Update Contribution Leaderboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 02:00 UTC
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for accurate stats

      - name: Update leaderboard
        run: python3 scripts/update_leaderboard.py

      - name: Create pull request if changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update contribution leaderboard [skip ci]"
          title: "chore: update contribution leaderboard"
          body: "Automated leaderboard update."
          branch: "chore/update-leaderboard"
          delete-branch: true
